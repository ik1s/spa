# Настройки приложения. Недостающие значения подставляет config.py.

server:
  host: 0.0.0.0   # слушать на всех интерфейсах (нужно, чтобы контейнер мог достучаться до хоста)
  port: 7777      # порт для /metrics, /health и /reports

polling:
  interval_seconds: 5          # как часто опрашивать датчики, в секундах
  metrics_update_seconds: 5    # пока не используется

collection:
  # true: опрос идёт всегда, кнопка замер не запускает.
  # false: опрос идёт только во время замера. Замер запускает кнопка (или
  # POST /collection/start) и длится duration_seconds; нажатие во время замера
  # отсчитывает время заново, POST /collection/stop останавливает замер досрочно.
  always_on: false
  duration_seconds: 180   # 3 минуты с нажатия

sensors:
  - name: dht11_1   # имя датчика, попадает в метку sensor="..." у метрик
    type: dht11     # тип датчика, см. SENSOR_TYPES в sensors/__init__.py
    pin: 4          # номер GPIO по нумерации BCM (GPIO4)

  - name: bh1750_1   # освещённость, GY-302 (подключён 2026-11-26)
    type: bh1750
    address: 0x23    # 0x5C, если вывод ADDR подключён к питанию

  # Беспроводной термогигрометр Inkbird IBS-TH2 на улице (Bluetooth). Раскомментировать, когда
  # приедет: адрес найти командой /opt/spa/app/venv/bin/python3 /opt/spa/app/tools/ble_scan.py
  # (имя устройства "sps"). outdoor: true — показания идут в spa_outdoor_*, по ним /reports
  # определяет холодный/тёплый период года.
  # - name: ibs_th2_outdoor
  #   type: inkbird_ibs_th
  #   address: "XX:XX:XX:XX:XX:XX"
  #   outdoor: true
  #   max_age_seconds: 180   # рассылка старше этого = датчик потерян

  - name: mlx90640_1   # тепловизор MLX90640ESF-BAB (55x35°), подключён 2026-11-26
    type: mlx90640
    address: 0x33
    refresh_hz: 2      # 0.5, 1, 2, 4, 8 или 16; выше 2 Гц шум растёт, а шине 100 кГц не хватит скорости

# Снимки тепловизора: при каждом запуске замера (кнопка или POST /collection/start) первый
# удачный кадр сохраняется в dir как thermal_ГГГГММДД_ЧЧММСС.png (картинка) и .json (температуры).
# Хранятся последние keep снимков, старые удаляются.
thermal_snapshots:
  enabled: true
  dir: /opt/spa/data/thermal
  keep: 100

# Отчёты по замерам (/reports). Замеры и значения берутся из VictoriaMetrics.
reports:
  victoria_url: http://localhost:8428
  lookback_days: 31      # насколько далеко в прошлое искать замеры (не больше хранения VictoriaMetrics)
  grafana_url: ""        # пусто: тот же адрес, по которому открыли /reports, порт 3000
  # Период года для оценки: cold, warm или auto. По СанПиН холодный период: среднесуточная
  # температура наружного воздуха +10 °C и ниже (п. 91); наружного датчика нет, поэтому auto
  # считает холодными месяцы с октября по апрель.
  season: auto
  # Нормативы для жилой комнаты квартиры, сверены с СанПиН 1.2.3685-21 (2026-11-26):
  # табл. 5.27 (микроклимат), 5.52 (освещение). text: колонка «Норматив СанПиН».
  # cold/warm: границы [от, до] для подсветки (null: без границы). Ячейка зелёная, если значение
  # в optimal, жёлтая, если только в permissible, красная, если вне permissible.
  norms:
    temperature_celsius:
      text: "холодный период: оптимально 20–22 °C, допустимо 18–24 °C; тёплый: оптимально 22–25 °C, допустимо 20–28 °C (табл. 5.27)"
      cold: {optimal: [20, 22], permissible: [18, 24]}
      warm: {optimal: [22, 25], permissible: [20, 28]}
    humidity_percent:
      text: "холодный период: оптимально 30–45 %, допустимо 30–60 %; тёплый: оптимально 30–60 %, допустимо 30–65 % (табл. 5.27)"
      cold: {optimal: [30, 45], permissible: [30, 60]}
      warm: {optimal: [30, 60], permissible: [30, 65]}
    illuminance_lux:
      text: "не менее 150 лк при искусственном освещении, на уровне пола (табл. 5.52); дневной свет нормируется КЕО, не в люксах"
      cold: {permissible: [150, null]}
      warm: {permissible: [150, null]}
    thermal:
      text: "СанПиН температуру поверхностей не нормирует"
    outdoor_temperature:
      text: "не нормируется; среднесуточная +10 °C и ниже — холодный период года (п. 91)"

# Сервопривод SG90 на аппаратном ШИМ. Включать только после подключения (сигнал на GPIO12,
# клемма IO12) и перезагрузки с оверлеем pwm (его добавляет Ansible).
servo:
  enabled: false
  pwm_chip: 0             # /sys/class/pwm/pwmchip0
  pwm_channel: 0          # канал 0 это GPIO12
  min_angle: 0
  max_angle: 180
  min_pulse_us: 500       # ширина импульса для min_angle, подбирается под экземпляр сервы
  max_pulse_us: 2400      # ширина импульса для max_angle
  speed_deg_per_s: 60     # скорость поворота, градусов в секунду

# Кнопка запуска замера (модуль KY-004: S на GPIO, "-" на GND, средний вывод свободен).
# Если серва включена (servo.enabled: true), нажатие заодно запускает её проход 0 -> 180 -> 0.
button:
  enabled: true
  pin: 23          # BCM, клемма IO23 платы
  bounce_ms: 300   # защита от дребезга контактов

logging:
  level: INFO       # DEBUG, INFO, WARNING или ERROR
