# Инвентарь: список хостов, которыми управляет Ansible.
# Группа [spa] состоит из одного Raspberry Pi. Впишите сюда свой адрес и пользователя.
[spa]
192.168.1.3 ansible_user=spa

# Переменные для всех хостов группы spa.
[spa:vars]
# Пароли в репозитории не хранятся. lookup('env', ...) читает их из переменных
# окружения на вашем компьютере в момент запуска. Перед запуском нужно задать
# SPA_SSH_PASS (при запуске через psecret это делает "psecret env").
# ansible_password это пароль SSH, ansible_become_password это пароль sudo.
# У нашего пользователя они совпадают.
ansible_password={{ lookup('env', 'SPA_SSH_PASS') }}
ansible_become_password={{ lookup('env', 'SPA_SSH_PASS') }}
# Входить по паролю (а не перебирать ключи) и принимать отпечаток нового хоста.
ansible_ssh_common_args='-o PreferredAuthentications=password -o StrictHostKeyChecking=accept-new'
