[defaults]
# Файл инвентаря по умолчанию, чтобы не писать -i inventory.ini каждый раз.
inventory = inventory.ini
# Не спрашивать подтверждение отпечатка SSH-ключа хоста при первом подключении.
# Удобно для домашней сети, но в боевой среде лучше оставить проверку включённой.
host_key_checking = False
# Не создавать файлы *.retry после неудачного запуска.
retry_files_enabled = False
