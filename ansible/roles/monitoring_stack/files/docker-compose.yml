# Описание двух контейнеров: хранилище метрик (VictoriaMetrics) и графики (Grafana).
# Запускается командой "docker compose up -d" из каталога /opt/spa.
services:
  victoriametrics:
    # Тег latest всегда тянет свежую версию. Это удобно, но неповторяемо:
    # для продакшена лучше закрепить конкретную версию.
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    # Перезапускать контейнер после сбоя и после перезагрузки хоста,
    # кроме случая, когда его остановили вручную.
    restart: unless-stopped
    # "порт_хоста:порт_контейнера": публикует порт контейнера наружу.
    ports:
      - "8428:8428"
    # Приложение spa работает на хосте, а не в контейнере. Внутри контейнера
    # "localhost" означает сам контейнер, поэтому до хоста нужно добираться по
    # специальному имени host.docker.internal. На Linux оно не существует само
    # по себе, и host-gateway говорит Docker подставить адрес хоста.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Данные лежат на хосте и переживают пересоздание контейнера.
      - ./data/victoria-metrics:/victoria-metrics-data
      # :ro (read-only): контейнер может читать файл, но не менять.
      - ./scrape.yml:/etc/victoriametrics/scrape.yml:ro
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
      # Файл со списком того, что VictoriaMetrics должна опрашивать (см. scrape.yml).
      - "--promscrape.config=/etc/victoriametrics/scrape.yml"
      - "--promscrape.config.strictParse=false"
    # Драйвер journald отправляет вывод контейнера в журнал systemd хоста, а оттуда
    # его забирает systemd-journal-upload и пересылает в VictoriaLogs.
    # Команда "docker logs" при этом продолжает работать.
    logging:
      driver: journald

  # Хранилище логов. Принимает логи из journald хоста и отдаёт их Grafana.
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    restart: unless-stopped
    # У VictoriaLogs нет аутентификации, порт открыт в локальную сеть сознательно.
    ports:
      - "9428:9428"
    volumes:
      - ./data/victoria-logs:/victoria-logs-data
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-httpListenAddr=:9428"
      # Логи старше 30 дней удаляются автоматически.
      - "-retentionPeriod=30d"
      # Поля, по которым логи делятся на потоки: так запросы вида
      # {_SYSTEMD_UNIT="..."} работают быстрее.
      - "-journald.streamFields=_SYSTEMD_UNIT,CONTAINER_NAME"
    logging:
      driver: journald

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    # Порядок запуска: сначала victoriametrics, потом grafana. Это только порядок
    # старта, а не ожидание, пока VictoriaMetrics будет готова принимать запросы.
    depends_on:
      - victoriametrics
      - victorialogs
    ports:
      - "3000:3000"
    # Пароль администратора лежит в файле .env (его создаёт Ansible из шаблона),
    # в самом compose-файле пароля нет.
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Плагин источника данных для VictoriaLogs. Grafana скачивает его при старте
      # (нужен доступ в интернет) и кладёт в data/grafana. Версия закреплена,
      # чтобы обновление плагина не ломало дашборды неожиданно.
      GF_INSTALL_PLUGINS: "victoriametrics-logs-datasource 0.33.1"
    logging:
      driver: journald
    volumes:
      - ./data/grafana:/var/lib/grafana
      # Источник данных и дашборды создаются автоматически из этих каталогов.
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
